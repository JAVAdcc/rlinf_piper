# Background learning from operator-accepted Piper segments. Stage 1 and actor model geometry
# are read from the checkpoint contracts by PiperOnlineRunner, never guessed.
cluster:
  num_nodes: 1
  component_placement: {actor: 0, rollout: 0, env: 0}
runner:
  task_type: embodied
  only_eval: false
  logger: {project_name: piper-online, experiment_name: segments}
env:
  group_name: PiperLocalEnv
  train: {env_type: real, total_num_envs: 1, rollout_epoch: 1}
rollout:
  group_name: PiperOnlineRollout
  pipeline_stage_num: 1
actor:
  group_name: PiperOnlineActor
  training_backend: fsdp
  micro_batch_size: 64
  global_batch_size: 64
  seed: 1234
  enable_offload: false
  optim: {lr: 0.0003, lr_scheduler: torch_constant, clip_grad: 10.0, weight_decay: 0.0}
  critic_optim: {lr: 0.0003, lr_scheduler: torch_constant, clip_grad: 10.0, weight_decay: 0.0}
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: false
    mixed_precision: {param_dtype: fp32, reduce_dtype: fp32, buffer_dtype: fp32}
algorithm:
  loss_type: rlt_ac
  adv_type: embodied_sac
  loss_agg_func: token-mean
  update_epoch: 5              # Critic updates earned per new replay transition.
  critic_actor_ratio: 2        # One actor step per two critic steps.
  rlt_schedule:
    enable: true
    warmup_min_size: 64        # Online transitions, not episode count.
    warmup_post_collect_updates: 0
    train_every_transitions: 1
    train_every_episodes: 0
    max_updates_per_train_step: 32 # Publish after each bounded background cycle.
  train_actor_steps: 0         # Warmup heads are already trained.
  gamma: 0.995                 # Per executed 30 Hz tick, as in offline warmup.
  tau: 0.005
  target_update_freq: 1
  target_update_type: q_head_only
  bootstrap_type: standard
  q_head_type: default
  reference_dropout_prob: 0.0
  bc_weight: 5.0
  q_weight: 0.1
  actor_weight_schedule:
    enable: true
    warmup_updates: 0
    ramp_updates: 1000
    warmup_bc_weight: 5.0
    warmup_q_weight: 0.0
    online_bc_weight: 2.0
    online_q_weight: 0.1
  entropy_tuning:
    alpha_type: fixed_alpha
    initial_alpha: 0.0
  replay_buffer:
    critical_phase_only: false # Adapter already emits only scored segments.
    enable_cache: true
    cache_size: 16
    sample_window_size: 200    # Uniform chunks from the latest 200 episodes.
    min_buffer_size: 1
    auto_save: true
    full_batch: true           # Sampling with replacement keeps the 32/32 mix exact.
weight_syncer:
  type: patch
  patch:
    snapshot_device: cpu
    delta_encoding: true
    compression: none
    init_sync: {enabled: true, prefixes: null, bucket_size: 134217728}
piper:
  async_training: true        # Old saved profiles without this field remain synchronous.
  offline_cache: null          # Supply --offline-cache; only train split is used.
  require_offline_cache: true
  require_critic_warmup: true
  replay_stride: 2
  replay_tail_policy: align
  replay_feature_batch_size: 2
  keep_checkpoints: 3
