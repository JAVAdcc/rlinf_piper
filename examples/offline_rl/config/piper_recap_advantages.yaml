# Single-arm Evo-RL Piper smoke run; see the RECAP documentation.
defaults:
- model/recap_value_model@advantage.model
- _self_
advantage:
  value_checkpoint: ${oc.env:PIPER_VALUE_CHECKPOINT}
  batch_size: 8
  flush_interval: 256
  num_dataloader_workers_per_gpu: 2
  prefetch_factor: 2
  discount_next_value: true
  positive_quantile: 0.3
  tag: piper
  returns_tag: piper
  model:
    critic_expert_variant: gemma_1m
    tokenizer_path: ${oc.env:GEMMA_MODEL_PATH}
    siglip_path: ${oc.env:SIGLIP_MODEL_PATH}
    gemma3_path: ${oc.env:GEMMA_MODEL_PATH}
data:
  model_type: pi05
  train_data_paths:
  - dataset_path: ${oc.env:PIPER_DATA_PATH}
    robot_type: piper
    type: rollout
    weight: 1.0
  advantage_lookahead_step: 10
  gamma: 1.0
  robot_type: piper
distributed:
  enabled: false
  backend: nccl
  timeout: 3600
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:REPO_PATH}/examples/offline_rl/config/
  job:
    chdir: false
