# RLT Stage 1 on the same 97 successful USB-light episodes as the prior SFT.
defaults:
- model/pi0_5@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- _self_
- override hydra/job_logging: stdout
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:EMBODIED_PATH}/config/
cluster:
  num_nodes: 1
  component_placement:
    actor: 0-7
runner:
  task_type: sft
  logger:
    log_path: ../results
    project_name: rlinf-rlt
    experiment_name: piper_usb_rlt_stage1_success97_b64_60k
    logger_backends:
    - tensorboard
  max_epochs: -1
  max_steps: 60000
  val_check_interval: -1
  save_interval: 2000
data:
  train_data_paths: ${oc.env:PIPER_DATA_PATH}
  num_workers: 2
  video_backend: pyav
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 8
  global_batch_size: 64
  seed: 42
  model:
    model_type: openpi
    is_lora: false
    model_path: ${oc.env:PI05_MODEL_PATH}
    num_action_chunks: 10
    action_dim: 7
    add_value_head: false
    num_steps: 4
    openpi_data:
      norm_stats_path: ${oc.env:PIPER_DATA_PATH}/meta/norm_stats.json
    openpi:
      task: sft
      config_name: pi05_piper
      num_images_in_input: 3
      train_expert_only: true
      noise_method: flow_noise
      noise_params:
      - 0.16
      - 0.12
      - 200
      joint_logprob: true
      detach_critic_input: true
      action_horizon: 10
      action_chunk: ${actor.model.num_action_chunks}
      action_env_dim: ${actor.model.action_dim}
      num_steps: ${actor.model.num_steps}
      model_action_dim: 32
      paligemma_variant: gemma_2b
      action_expert_variant: gemma_300m
      max_token_len: 200
      discrete_state_input: false
      use_rlt: true
      rlt_alpha: 1.0
      rlt_prefix_seq_len: 1024
      rlt_image_only: false
      rlt_use_mask: true
      torch_compile: false
  optim:
    lr: 1e-5
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 1.0e-10
    clip_grad: 1.0
    total_training_steps: ${runner.max_steps}
    lr_warmup_steps: 1000
    lr_scheduler: cosine
    num_cycles: 0.5
    min_lr: 2.5e-06
  fsdp_config:
    strategy: fsdp
    sharding_strategy: no_shard
    use_orig_params: true
    # SFT forward currently disables activation checkpointing.
    gradient_checkpointing: false
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    save_full_model_weights: true
